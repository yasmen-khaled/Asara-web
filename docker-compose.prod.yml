version: '3.8'

services:
  # Laravel Application (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: production
    container_name: asara-web-app-prod
    ports:
      - "80:80"
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./.env:/var/www/html/.env
    depends_on:
      - db
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_DATABASE=asara_web
      - DB_USERNAME=asara_user
      - DB_PASSWORD=asara_password
    restart: unless-stopped
    networks:
      - asara-network

  # MySQL Database (Production)
  db:
    image: mysql:8.0
    container_name: asara-web-db-prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: asara_web
      MYSQL_USER: asara_user
      MYSQL_PASSWORD: asara_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - asara-network

  # Redis (Production)
  redis:
    image: redis:7-alpine
    container_name: asara-web-redis-prod
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - asara-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: asara-web-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - asara-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  asara-network:
    driver: bridge 